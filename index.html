<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mow Master 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87b5e0; font-family: 'Segoe UI', system-ui, sans-serif; }
  #hud {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.5); text-align: center; pointer-events: none;
  }
  #hud h1 { margin: 0; font-size: 22px; letter-spacing: 2px; }
  #bar { width: 320px; height: 18px; background: rgba(0,0,0,.45); border-radius: 9px; margin: 8px auto 4px; overflow: hidden; border: 2px solid rgba(255,255,255,.6); }
  #fill { height: 100%; width: 0%; background: linear-gradient(90deg,#6abe30,#a4e34a); transition: width .2s; }
  #pct { font-size: 14px; }
  #time { position: fixed; top: 16px; right: 20px; color: #fff; font-size: 20px; text-shadow: 0 2px 4px rgba(0,0,0,.5); }
  #help {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    color: #fff; background: rgba(0,0,0,.4); padding: 8px 16px; border-radius: 8px; font-size: 13px;
  }
  #win {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
    background: rgba(0,0,0,.55); color: #fff; text-align: center;
  }
  #win h1 { font-size: 48px; margin: 0 0 8px; }
  #win p { font-size: 20px; }
  #win button { margin-top: 18px; font-size: 18px; padding: 10px 24px; border-radius: 8px; border: none; background: #6abe30; color: #fff; cursor: pointer; }
  #win button:hover { background: #7ed63e; }
</style>
</head>
<body>
<div id="hud">
  <h1>MOW MASTER 3D</h1>
  <div id="bar"><div id="fill"></div></div>
  <div id="pct">Lawn cut: 0%</div>
</div>
<div id="time">0:00</div>
<div id="help">W/S drive &nbsp;|&nbsp; A/D steer &nbsp;|&nbsp; Shift boost &nbsp;|&nbsp; R restart</div>
<div id="win">
  <h1 id="winTitle">LAWN MOWED!</h1>
  <p id="winText"></p>
  <button onclick="location.reload()">Mow Again</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ---------- Scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b5e0);
scene.fog = new THREE.Fog(0x87b5e0, 60, 160);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const sun = new THREE.DirectionalLight(0xfff2d0, 1.2);
sun.position.set(30, 50, 20);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x4a7a30, 0.9));

// ---------- Ground ----------
const LAWN = 90, HALF = LAWN / 2;
const dirt = new THREE.Mesh(
  new THREE.PlaneGeometry(600, 600),
  new THREE.MeshLambertMaterial({ color: 0x8a6b45 })
);
dirt.rotation.x = -Math.PI / 2;
dirt.position.y = -0.05;
scene.add(dirt);

const lawn = new THREE.Mesh(
  new THREE.BoxGeometry(LAWN, 0.3, LAWN),
  new THREE.MeshLambertMaterial({ color: 0x3e7a24 })
);
lawn.position.y = -0.15;
scene.add(lawn);

// ---------- Grass (instanced + wind shader) ----------
const SPACING = 0.42;
const cols = Math.floor(LAWN / SPACING);
const COUNT = cols * cols;

const geo = new THREE.PlaneGeometry(0.22, 1.1, 1, 3);
geo.translate(0, 0.5, 0);

const offsets = new Float32Array(COUNT * 3);
const randoms = new Float32Array(COUNT * 2);
const heights = new Float32Array(COUNT);
const px = new Float32Array(COUNT);
const pz = new Float32Array(COUNT);

// obstacles (trees) — grass is skipped inside their radius
const trees = [];
function addTree(x, z, r) {
  trees.push({ x, z, r });
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.5, 3, 8), new THREE.MeshLambertMaterial({ color: 0x6b4a2b }));
  trunk.position.y = 1.5;
  const crown = new THREE.Mesh(new THREE.SphereGeometry(2.4, 10, 8), new THREE.MeshLambertMaterial({ color: 0x2d6a1e }));
  crown.position.y = 4.2;
  crown.scale.y = 1.15;
  g.add(trunk, crown);
  g.position.set(x, 0, z);
  scene.add(g);
}
addTree(-25, -20, 2.2);
addTree(28, 12, 2.4);
addTree(-8, 30, 2.0);
addTree(15, -32, 2.3);
addTree(-35, 22, 2.1);

// ---------- Rocks to dodge while mowing ----------
const rockMatL = new THREE.MeshLambertMaterial({ color: 0x77777d, flatShading: true });
function addRock(x, z, r) {
  const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 0), rockMatL);
  rock.scale.y = 0.7;
  rock.position.set(x, r * 0.3, z);
  rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
  scene.add(rock);
  trees.push({ x, z, r: r * 0.9 }); // solid collision + grass skipped
}
addRock(18, 6, 1.6);
addRock(-12, -8, 1.3);
addRock(-22, 12, 1.1);
addRock(8, -20, 1.5);
addRock(-2, 15, 1.0);
addRock(30, -8, 1.2);
addRock(-30, -18, 1.1);
addRock(20, 25, 1.3);

// ---------- Chicken coop (center of the map) ----------
const coop = new THREE.Group();
const woodMat = new THREE.MeshLambertMaterial({ color: 0x9c6b3f });
const darkWood = new THREE.MeshLambertMaterial({ color: 0x6e4a28 });
const walls = new THREE.Mesh(new THREE.BoxGeometry(5, 2.2, 3.5), woodMat);
walls.position.y = 1.6;
const roofL = new THREE.Mesh(new THREE.BoxGeometry(5.8, 0.16, 2.2), darkWood);
roofL.position.set(0, 3.25, -0.95);
roofL.rotation.x = 0.62;
const roofR = roofL.clone();
roofR.position.z = 0.95;
roofR.rotation.x = -0.62;
const door = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.5), new THREE.MeshLambertMaterial({ color: 0x1e120a }));
door.position.set(0, 0.95, 1.76);
const ramp = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.08, 1.5), darkWood);
ramp.position.set(0, 0.35, 2.35);
ramp.rotation.x = -0.5;
coop.add(walls, roofL, roofR, door, ramp);
scene.add(coop);
// treat it like a tree for grass-skipping + collision
trees.push({ x: 0, z: 0, r: 3.0 });

// ---------- Gnome caves in the corners ----------
const caves = [];
const rockMat = new THREE.MeshLambertMaterial({ color: 0x8d8d93 });
const caveMat = new THREE.MeshLambertMaterial({ color: 0x121215 });
for (const [cx, cz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
  const x = cx * (HALF - 5), z = cz * (HALF - 5);
  const cave = new THREE.Group();
  const mound = new THREE.Mesh(new THREE.SphereGeometry(2.6, 12, 9), rockMat);
  mound.scale.y = 0.55;
  mound.position.y = 0.2;
  const mouth = new THREE.Mesh(new THREE.CircleGeometry(1.05, 18), caveMat);
  mouth.position.set(0, 0.75, 1.9);
  cave.add(mound, mouth);
  cave.position.set(x, 0, z);
  cave.lookAt(0, 0, 0); // entrance faces the lawn's center
  scene.add(cave);
  caves.push({ x, z });
  trees.push({ x, z, r: 2.4 }); // solid + grass skipped around it
}

// ---------- Chickens ----------
const chickens = [];
function makeChicken() {
  const g = new THREE.Group();
  const white = new THREE.MeshLambertMaterial({ color: 0xf5f0e6 });
  const red = new THREE.MeshLambertMaterial({ color: 0xd23a2a });
  const orange = new THREE.MeshLambertMaterial({ color: 0xe8942a });
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 10), white);
  body.scale.set(1, 0.9, 1.35);
  body.position.y = 0.48;
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.4, 6), white);
  tail.position.set(0, 0.42, -0.38);
  tail.rotation.x = 0.9;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), white);
  head.position.set(0, 0.62, 0.32);
  const comb = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.14, 0.16), red);
  comb.position.set(0, 0.76, 0.28);
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.16, 6), orange);
  beak.position.set(0, 0.6, 0.44);
  beak.rotation.x = Math.PI / 2;
  const wattle = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 5), red);
  wattle.position.set(0, 0.52, 0.38);
  const legMat = orange;
  const legs = [];
  for (const sx of [-0.1, 0.1]) {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.32, 6), legMat);
    leg.position.set(sx, 0.16, 0);
    g.add(leg);
    legs.push(leg);
  }
  g.add(body, tail, head, comb, beak, wattle);
  g.userData = { legs, head, comb, beak, wattle, heading: Math.random() * Math.PI * 2, speed: 0, timer: Math.random() * 3, panic: 0, headY: 0 };
  const a = 4.5 + Math.random() * 8;
  const b = Math.random() * Math.PI * 2;
  g.position.set(Math.sin(b) * a, 0, Math.cos(b) * a);
  g.rotation.y = g.userData.heading;
  scene.add(g);
  chickens.push(g);
}
for (let n = 0; n < 7; n++) makeChicken();

function updateChickens(dt, t) {
  // threat = whichever character the player is controlling
  const threat = mode === 'mow' ? mower : man;
  for (const c of chickens) {
    const u = c.userData;
    if (u.carried) continue; // hanging in a gnome's arms
    const dx = c.position.x - threat.position.x;
    const dz = c.position.z - threat.position.z;
    const d = Math.hypot(dx, dz);

    // flee from the player or any nearby gnome
    let threatX = threat.position.x, threatZ = threat.position.z, bestD = d;
    for (const gn of gnomes) {
      if (gn.userData.flying || gn.userData.landed > 0) continue;
      const gd = Math.hypot(c.position.x - gn.position.x, c.position.z - gn.position.z);
      if (gd < bestD) { bestD = gd; threatX = gn.position.x; threatZ = gn.position.z; }
    }
    if (bestD < 4) {
      u.heading = Math.atan2(c.position.x - threatX, c.position.z - threatZ);
      u.speed = 4.2;
      u.panic = 2;
    } else if (u.panic > 0) {
      u.panic -= dt;
      u.speed = u.panic > 0 ? 3 : 0;
    } else {
      // wander: occasionally pick a new direction / stop to peck
      u.timer -= dt;
      if (u.timer <= 0) {
        u.timer = 1.5 + Math.random() * 3.5;
        if (Math.random() < 0.7) { u.heading = Math.random() * Math.PI * 2; u.speed = 1; }
        else u.speed = 0;
      }
    }

    // head back to the coop if strayed too far
    if (u.panic <= 0 && Math.hypot(c.position.x, c.position.z) > 20) {
      u.heading = Math.atan2(-c.position.x, -c.position.z);
      u.speed = 1.2;
    }

    // stay on the lawn
    const limC = HALF - 5;
    if (Math.abs(c.position.x) > limC || Math.abs(c.position.z) > limC) {
      u.heading = Math.atan2(-c.position.x, -c.position.z);
    }
    // don't walk into the coop
    if (Math.hypot(c.position.x, c.position.z) < 3.4) {
      u.heading = Math.atan2(c.position.x, c.position.z);
    }

    c.rotation.y = u.heading;
    c.position.x += Math.sin(u.heading) * u.speed * dt;
    c.position.z += Math.cos(u.heading) * u.speed * dt;

    // leg scrambling + head bob / peck when idle
    const amp2 = Math.min(1, u.speed / 2);
    const scurry = t * 14 * Math.max(amp2, u.speed > 0 ? 0.4 : 0);
    u.legs[0].rotation.x = Math.sin(scurry) * 0.7 * amp2;
    u.legs[1].rotation.x = -Math.sin(scurry) * 0.7 * amp2;
    if (u.speed === 0 && u.panic <= 0) {
      u.headY = Math.max(0, Math.sin(t * 6) * 0.5 - 0.3); // pecking
    } else {
      u.headY = 0;
    }
    u.head.position.y = 0.62 - u.headY * 0.9;
    u.comb.position.y = 0.76 - u.headY * 0.9;
    u.beak.position.y = 0.6 - u.headY * 0.9;
    u.wattle.position.y = 0.52 - u.headY * 0.9;
    c.position.y = Math.abs(Math.sin(scurry)) * 0.03 * amp2;
  }
  // occasional chicken voices
  chickVoiceT -= dt;
  if (chickVoiceT <= 0 && chickens.length) {
    const c0 = chickens[Math.floor(Math.random() * chickens.length)];
    if (!c0.userData.carried) {
      if (c0.userData.panic > 0 || c0.userData.speed > 2) sfxSquawk();
      else sfxCluck();
    }
    chickVoiceT = 1.5 + Math.random() * 3.5;
  }
}

// ---------- Evil lawn gnomes ----------
const gnomes = [];
let gnomeTimer = 10;
let swingT = 0;
let stepAcc = 0;
let gnomeVoiceT = 0;
let chickVoiceT = 0;

function spawnGnome() {
  const g = new THREE.Group();
  // squat little body
  const robe = new THREE.Mesh(new THREE.ConeGeometry(0.38, 0.8, 12), new THREE.MeshLambertMaterial({ color: 0x2f5fc4 }));
  robe.position.y = 0.42;
  // big round belly for the classic fat-gnome look
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 10), new THREE.MeshLambertMaterial({ color: 0x2f5fc4 }));
  belly.position.set(0, 0.5, 0.04);
  g.add(belly);
  // boots peeking out under the robe
  for (const sx of [-0.12, 0.12]) {
    const boot = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 5), new THREE.MeshLambertMaterial({ color: 0x1a1a1a }));
    boot.scale.set(1.3, 0.6, 1.6);
    boot.position.set(sx, 0.06, 0.08);
    g.add(boot);
  }
  // belt around the belly
  const belt = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.1, 14), new THREE.MeshLambertMaterial({ color: 0x3a2410 }));
  belt.position.y = 0.5;
  // head
  const gnomesHead = new THREE.Mesh(new THREE.SphereGeometry(0.17, 10, 8), skin);
  gnomesHead.position.y = 0.95;
  // big round nose sticking out
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), skin);
  nose.position.set(0, 0.88, 0.16);
  // eyes
  for (const sx of [-0.06, 0.06]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.02, 6, 5), new THREE.MeshLambertMaterial({ color: 0x111111 }));
    eye.position.set(sx, 0.95, 0.14);
    g.add(eye);
  }
  // fluffy white beard
  const beard = new THREE.Mesh(new THREE.SphereGeometry(0.19, 10, 8), new THREE.MeshLambertMaterial({ color: 0xf5f5f0 }));
  beard.scale.set(1.1, 1.4, 0.7);
  beard.position.set(0, 0.78, 0.12);
  // tall pointy red hat, slightly bent at the tip
  const gnomesHat = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.75, 12), new THREE.MeshLambertMaterial({ color: 0xd23a2a }));
  gnomesHat.position.y = 1.35;
  gnomesHat.rotation.x = -0.22;
  gnomesHat.rotation.z = 0.15;
  // stubby little arms resting on the belly
  for (const sx of [-0.34, 0.34]) {
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.28, 6), new THREE.MeshLambertMaterial({ color: 0x2f5fc4 }));
    arm.position.set(sx, 0.62, 0.25);
    arm.rotation.z = sx * 1.6;
    arm.rotation.x = -0.5;
    g.add(arm);
  }
  g.add(robe, belly, belt, gnomesHead, nose, beard, gnomesHat);
  // emerge from a random cave
  const cave = caves[Math.floor(Math.random() * caves.length)];
  const cl = Math.hypot(cave.x, cave.z) || 1;
  g.position.set(cave.x - cave.x / cl * 3.2, 0, cave.z - cave.z / cl * 3.2);
  g.userData = { flying: false, v: new THREE.Vector3(), landed: 0, attackT: 0, carrying: null };
  scene.add(g);
  gnomes.push(g);
}

function nearestCave(x, z) {
  let best = caves[0], bd = Infinity;
  for (const c of caves) {
    const d2 = (c.x - x) ** 2 + (c.z - z) ** 2;
    if (d2 < bd) { bd = d2; best = c; }
  }
  return best;
}

function batHit() {
  const h = walkCtl.heading;
  const fh = Math.sin(h), fh2 = Math.cos(h);
  for (const g of gnomes) {
    if (g.userData.flying || g.userData.landed > 0) continue;
    const dx = g.position.x - man.position.x;
    const dz = g.position.z - man.position.z;
    const d = Math.hypot(dx, dz);
    if (d < 2.4 && (dx * fh + dz * fh2) / (d || 1) > 0.05) {
      g.userData.flying = true;
      sfxHit();
      g.userData.v.set(fh * 17 + (Math.random() - 0.5) * 5, 10 + Math.random() * 5, fh2 * 17 + (Math.random() - 0.5) * 5);
      g.position.y = 0.5;
    }
  }
}

function updateGnomes(dt, t) {
  if (started && !won) {
    gnomeTimer -= dt;
    // spawn pressure scales with lawn progress: 1/4 rate early, full rate in the last 10%
    const p = cutCount / total;
    const f = p < 0.9 ? 0.25 + 0.75 * (p / 0.9) : 1;
    const maxGnomes = Math.max(1, Math.round(Math.min(1 + elapsed / 25, 6) * f));
    if (gnomeTimer <= 0 && gnomes.length < maxGnomes) {
      gnomeTimer = Math.max(2.5, 8 - elapsed / 15) / f;
      spawnGnome();
    }
  }
  for (let gi = gnomes.length - 1; gi >= 0; gi--) {
    const g = gnomes[gi];
    const u = g.userData;
    const sp = 4.8 + elapsed * 0.004; // faster than a fleeing chicken
    if (u.flying) {
      u.v.y -= 22 * dt;
      g.position.addScaledVector(u.v, dt);
      g.rotation.x += dt * 14;
      if (g.position.y <= 0.05 && u.v.y < 0) {
        u.landed = 0.9;
        u.flying = false;
        g.position.y = 0;
        g.rotation.x = Math.PI / 2; // knocked flat
        // drop any chicken it was carrying — it's rescued
        if (u.carrying) {
          const held = u.carrying;
          u.carrying = null;
          held.userData.carried = false;
          held.visible = true;
          g.remove(held);
          held.position.copy(g.position);
          held.position.y = 0;
          held.rotation.set(0, held.rotation.y, 0);
          held.scale.setScalar(1);
          scene.add(held);
          held.userData.panic = 3;
        }
      }
      continue;
    }
    if (u.landed > 0) {
      u.landed -= dt;
      if (u.landed <= 0) { scene.remove(g); gnomes.splice(gi, 1); }
      continue;
    }
    if (u.carrying) {
      // haul the chicken back to the nearest cave
      const cv = nearestCave(g.position.x, g.position.z);
      const dx = cv.x - g.position.x, dz = cv.z - g.position.z;
      const d = Math.hypot(dx, dz);
      g.rotation.y = Math.atan2(dx, dz);
      if (d < 2.4) {
        // delivered — chicken is gone for good, gnome vanishes inside
        const ci = chickens.indexOf(u.carrying);
        if (ci >= 0) chickens.splice(ci, 1);
        scene.remove(u.carrying);
        scene.remove(g);
        gnomes.splice(gi, 1);
      } else {
        const carrySpeed = sp * 0.55; // weighed down by its catch
        g.position.x += dx / d * carrySpeed * dt;
        g.position.z += dz / d * carrySpeed * dt;
        g.rotation.z = Math.sin(t * 14) * 0.1;
      }
      continue;
    }
    // hunt the nearest free chicken
    let target = null, best = Infinity;
    for (const c of chickens) {
      if (c.userData.carried) continue;
      const d2 = c.position.distanceToSquared(g.position);
      if (d2 < best) { best = d2; target = c; }
    }
    if (!target) continue;
    const dx2 = target.position.x - g.position.x, dz2 = target.position.z - g.position.z;
    g.rotation.y = Math.atan2(dx2, dz2);
    const d = Math.sqrt(best);
    if (d > 0.75) {
      g.position.x += dx2 / d * sp * dt;
      g.position.z += dz2 / d * sp * dt;
      g.rotation.z = Math.sin(t * 12) * 0.1;
      u.attackT = 0;
      gnomeVoiceT -= dt;
      if (gnomeVoiceT <= 0) { sfxGnome(); gnomeVoiceT = 1.5 + Math.random() * 2.5; }
    } else {
      // snatch the chicken and run for the cave
      u.carrying = target;
      target.userData.carried = true;
      g.add(target);
      target.position.set(0, 1.05, -0.1); // dangling in the gnome's arms
      target.rotation.set(0, 0, 0);
      target.rotation.z = 0.6; // limp, upside-down-ish
      target.scale.setScalar(0.75);
      u.attackT = 0;
    }
  }
}

// spatial hash for fast cut detection
const CELL = 2.0;
const grid = new Map();
const key = (cx, cz) => cx + ',' + cz;

let i = 0;
for (let gx = 0; gx < cols; gx++) {
  for (let gz = 0; gz < cols; gz++, i++) {
    const x = -HALF + gx * SPACING + (Math.random() - 0.5) * SPACING * 0.7;
    const z = -HALF + gz * SPACING + (Math.random() - 0.5) * SPACING * 0.7;
    px[i] = x; pz[i] = z;
    offsets[i * 3] = x; offsets[i * 3 + 1] = 0; offsets[i * 3 + 2] = z;
    randoms[i * 2] = Math.random(); randoms[i * 2 + 1] = Math.random();
    heights[i] = 0.85 + Math.random() * 0.35;
    let skip = false;
    for (const t of trees) {
      const dx = x - t.x, dz = z - t.z;
      if (dx * dx + dz * dz < (t.r + 0.4) ** 2) { skip = true; break; }
    }
    if (skip) heights[i] = -1; // never exists
    const k = key(Math.floor((x + HALF) / CELL), Math.floor((z + HALF) / CELL));
    let arr = grid.get(k);
    if (!arr) { arr = []; grid.set(k, arr); }
    arr.push(i);
  }
}
// hide skipped blades entirely

const grassGeo = geo;

grassGeo.setAttribute('aRandom', new THREE.InstancedBufferAttribute(randoms, 2));
const heightAttr = new THREE.InstancedBufferAttribute(heights, 1);
grassGeo.setAttribute('aHeight', heightAttr);

const grassMat = new THREE.ShaderMaterial({
  side: THREE.DoubleSide,
  uniforms: { uTime: { value: 0 } },
  vertexShader: /* glsl */`
    attribute vec3 aOffset;
    attribute vec2 aRandom;
    attribute float aHeight;
    uniform float uTime;
    varying float vY;
    varying float vRand;
    varying float vH;
    void main() {
      float t = uv.y;
      vY = t; vRand = aRandom.x; vH = aHeight;
      vec3 pos = position;
      pos.xz *= 1.0 - t * 0.85;            // taper toward tip
      pos.y *= aHeight;
      float gust = sin(uTime * 0.4) * 0.5 + 0.5;
      float wind = sin(uTime * 1.6 + aOffset.x * 0.35 + aOffset.z * 0.5) * 0.6
                 + sin(uTime * 3.9 + aRandom.y * 6.2831) * 0.18;
      float sway = wind * (0.22 + gust * 0.38) * t * t * aHeight;
      pos.x += sway;
      pos.z += sway * 0.55;
      vec3 world = pos + aOffset;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(world, 1.0);
    }`,
  fragmentShader: /* glsl */`
    varying float vY;
    varying float vRand;
    varying float vH;
    void main() {
      vec3 root = vec3(0.04, 0.22, 0.05);
      vec3 tip  = vec3(0.38, 0.78, 0.22);
      vec3 col = mix(root, tip, vY) * (0.85 + vRand * 0.35);
      if (vH < 0.12) col = mix(col, vec3(0.30, 0.45, 0.12), 0.45); // cut stubble
      gl_FragColor = vec4(col, 1.0);
    }`
});

// ---------- Cut detection ----------
function cutGrass() {
  const r = 1.15, r2 = r * r;
  const cx = Math.floor((mower.position.x + HALF) / CELL);
  const cz = Math.floor((mower.position.z + HALF) / CELL);
  let changed = false;
  for (let ox = -1; ox <= 1; ox++) for (let oz = -1; oz <= 1; oz++) {
    const arr = grid.get(key(cx + ox, cz + oz));
    if (!arr) continue;
    for (const idx of arr) {
      const h = heights[idx];
      if (h > 0.1) {
        const dx = px[idx] - mower.position.x, dz = pz[idx] - mower.position.z;
        if (dx * dx + dz * dz < r2) {
          heights[idx] = 0.08;
          cutCount++;
          changed = true;
          if (Math.random() < 0.15) spawnClip(px[idx], pz[idx]);
        }
      }
    }
  }
  if (changed) heightAttr.needsUpdate = true;
}

let audioCtx = null;
let audioMaster = null;
let soundsReady = false;
let musicNodes = null;

function b64ToArrayBuffer(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

async function startMusic() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();
  const master = audioCtx.createGain();
  master.gain.value = 0.5;
  master.connect(audioCtx.destination);
  audioMaster = master;

  // decode all embedded mp3s
  const jobs = Object.entries(SOUND_DATA).map(async ([name, b64]) => {
    SND[name] = await audioCtx.decodeAudioData(b64ToArrayBuffer(b64));
  });
  await Promise.all(jobs);
  soundsReady = true;

  // looping soundtrack
  const src = audioCtx.createBufferSource();
  src.buffer = SND.music;
  src.loop = true;
  const g = audioCtx.createGain();
  g.gain.value = 0.55;
  src.connect(g);
  g.connect(audioMaster);
  src.start();
  musicNodes = { src, g };
}

function playBuf(name, vol = 1, rate = 1) {
  if (!audioCtx || !soundsReady || !SND[name]) return;
  const src = audioCtx.createBufferSource();
  src.buffer = SND[name];
  src.playbackRate.value = rate;
  const g = audioCtx.createGain();
  g.gain.value = vol;
  src.connect(g);
  g.connect(audioMaster);
  src.start();
}

// ---------- Sound effects (sampled) ----------
const SND = {}; // decoded buffers: music, engine, gnome, cluck, squawk, hit, swing, step

function sfxStep() { playBuf('step', 0.55, 0.85 + Math.random() * 0.3); }
function sfxSwing() { playBuf('swing', 0.9, 0.95 + Math.random() * 0.1); }
function sfxHit() { playBuf('hit', 1, 0.92 + Math.random() * 0.12); }
function sfxGnome() { playBuf('gnome', 0.85, 0.85 + Math.random() * 0.3); }
function sfxCluck() { playBuf('cluck', 0.75, 0.9 + Math.random() * 0.3); }
function sfxSquawk() { playBuf('squawk', 0.9, 0.95 + Math.random() * 0.1); }

// mower engine
let engineNodes = null;
function startEngine() {
  const src = audioCtx.createBufferSource();
  src.buffer = SND.engine;
  src.loop = true;
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 600;
  const gain = audioCtx.createGain();
  gain.gain.value = 0;
  src.connect(lp);
  lp.connect(gain);
  gain.connect(audioMaster);
  src.start();
  engineNodes = { gain, src };
}

// ---------- Loop ----------
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(0, 6, 45);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  grassMat.uniforms.uTime.value = t;

  // mower engine drone
  if (audioCtx && soundsReady && !engineNodes) startEngine();
  if (engineNodes) {
    engineNodes.gain.gain.setTargetAtTime(mode === 'mow' ? 0.55 : 0, audioCtx.currentTime, 0.08);
    engineNodes.src.playbackRate.setTargetAtTime(0.85 + Math.abs(mowCtl.speed) * 0.025, audioCtx.currentTime, 0.06);
  }

  if (!won) {
    if (!started && (keys.KeyW || keys.ArrowUp || keys.KeyS || keys.ArrowDown)) started = true;
    if (started) elapsed += dt;

    // grab / release logic
    const hx = mower.position.x - Math.sin(mowCtl.heading) * 1.5;
    const hz = mower.position.z - Math.cos(mowCtl.heading) * 1.5;
    const nearHandle = Math.hypot(man.position.x - hx, man.position.z - hz) < 2.4;
    if (mouseDown && nearHandle) mode = 'mow';
    else if (!mouseDown && mode === 'mow') { mode = 'walk'; mowCtl.speed = 0; }
    helpEl.textContent = mode === 'mow'
      ? 'GRIPPING HANDLE — W/S drive | A/D steer | Shift boost | RELEASE MOUSE to let go'
      : 'Hold LEFT MOUSE on the mower handle to grab it | W/A/S/D walk | Shift run';

    const me = mode === 'mow' ? mower : man;
    const ctl = mode === 'mow' ? mowCtl : walkCtl;

    // drive active character
    const boost = keys.ShiftLeft || keys.ShiftRight;
    const accel = mode === 'mow' ? (boost ? 22 : 12) : (boost ? 18 : 10);
    const maxSpeed = mode === 'mow' ? (boost ? 16 : 9) : (boost ? 10 : 5);
    if (keys.KeyW || keys.ArrowUp) ctl.speed += accel * dt;
    else if (keys.KeyS || keys.ArrowDown) ctl.speed -= accel * 0.7 * dt;
    else ctl.speed *= Math.pow(0.02, dt); // friction
    ctl.speed = THREE.MathUtils.clamp(ctl.speed, -maxSpeed * 0.5, maxSpeed);
    const turnRate = mode === 'mow' ? 2.2 : 3.0;
    if (keys.KeyA || keys.ArrowLeft) ctl.heading += dt * turnRate * Math.min(1, Math.abs(ctl.speed) / 2) * Math.sign(ctl.speed || 1);
    if (keys.KeyD || keys.ArrowRight) ctl.heading -= dt * turnRate * Math.min(1, Math.abs(ctl.speed) / 2) * Math.sign(ctl.speed || 1);

    me.rotation.y = ctl.heading + (mode === 'walk' ? Math.PI : 0); // the man's model faces -z
    me.position.x += Math.sin(ctl.heading) * ctl.speed * dt;
    me.position.z += Math.cos(ctl.heading) * ctl.speed * dt;

    // bounds
    const lim = HALF - 2;
    me.position.x = THREE.MathUtils.clamp(me.position.x, -lim, lim);
    me.position.z = THREE.MathUtils.clamp(me.position.z, -lim, lim);

    // tree collision
    for (const tr of trees) {
      const dx = me.position.x - tr.x, dz = me.position.z - tr.z;
      const d = Math.hypot(dx, dz), min = tr.r + (mode === 'mow' ? 0.9 : 0.5);
      if (d < min && d > 0.001) {
        me.position.x = tr.x + dx / d * min;
        me.position.z = tr.z + dz / d * min;
        ctl.speed *= 0.4;
      }
    }

    if (mode === 'mow') {
      // wheels + body bob
      const wSpin = mowCtl.speed * dt / 0.32;
      for (const w of wheels) w.rotation.x -= wSpin;
      mower.rotation.z = Math.sin(t * 20) * 0.008 * Math.min(1, Math.abs(mowCtl.speed) / 3);

      // man is attached behind the mower
      man.position.set(
        mower.position.x - Math.sin(mowCtl.heading) * 2.3,
        man.position.y,
        mower.position.z - Math.cos(mowCtl.heading) * 2.3
      );
      man.rotation.y = mowCtl.heading + Math.PI;
    }

    // walking animation
    const walk = t * Math.abs(ctl.speed) * (mode === 'mow' ? 1.6 : 2.2);
    const amp = Math.min(1, Math.abs(ctl.speed));
    legPivots[0].rotation.x = Math.sin(walk) * 0.6 * amp;
    legPivots[1].rotation.x = -Math.sin(walk) * 0.6 * amp;
    man.position.y = Math.abs(Math.sin(walk)) * 0.06 * amp;

    // footsteps when moving
    stepAcc += Math.abs(ctl.speed) * dt;
    if (stepAcc > 1.1) { stepAcc = 0; sfxStep(); }

    if (mode === 'mow') cutGrass();

    // gnomes + bat swing animation
    updateGnomes(dt, t);
    bat.visible = mode === 'walk';
    if (swingT > 0) swingT -= dt;
    // swing sweeps horizontally (yaw) across the body for wide hits
    shoulder.rotation.x = -0.62;
    shoulder.rotation.y = swingT > 0
      ? Math.sin((1 - Math.max(swingT, 0) / 0.4) * Math.PI) * 2.4 - 1.2
      : 0;

    // HUD
    const progress = cutCount / total;
    fill.style.width = (progress * 100).toFixed(1) + '%';
    pct.textContent = 'Lawn cut: ' + (progress * 100).toFixed(1) + '%  |  Chickens alive: ' + chickens.length;
    const m = Math.floor(elapsed / 60), s = Math.floor(elapsed % 60);
    timeEl.textContent = m + ':' + String(s).padStart(2, '0');

    if (chickens.length === 0) {
      won = true;
      winTitle.textContent = 'ALL YOUR CHICKENS ARE GONE!';
      winText.textContent = 'The lawn gnomes got your whole flock...';
      winEl.style.display = 'flex';
    } else if (progress >= 0.99) {
      won = true;
      winTitle.textContent = 'LAWN MOWED!';
      winText.textContent = 'You finished in ' + timeEl.textContent + ' with ' + chickens.length + ' chickens alive';
      winEl.style.display = 'flex';
    }
  }

  // chickens (always alive, even after winning)
  updateChickens(dt, t);

  // clipping particles
  for (const p of parts) {
    if (p.life > 0) {
      p.life -= dt;
      p.vy -= 12 * dt;
      p.m.position.x += p.vx * dt;
      p.m.position.y += p.vy * dt;
      p.m.position.z += p.vz * dt;
      p.m.rotation.x += dt * 10;
      if (p.m.position.y < 0.05 || p.life <= 0) { p.life = 0; p.m.visible = false; }
    }
  }

  // camera follows the active character
  const ah = mode === 'mow' ? mowCtl.heading : walkCtl.heading;
  const follow = mode === 'mow' ? mower : man;
  const fx = Math.sin(ah), fz = Math.cos(ah);
  const target = new THREE.Vector3(
    follow.position.x - fx * 9,
    5.5,
    follow.position.z - fz * 9
  );
  camPos.lerp(target, 1 - Math.pow(0.001, dt));
  camera.position.copy(camPos);
  camera.lookAt(follow.position.x + fx * 3, 1.2, follow.position.z + fz * 3);

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
