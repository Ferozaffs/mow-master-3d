<style>

<script type="module">
import * as THREE from 'three';

// ---------- Scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b5e0);
scene.fog = new THREE.Fog(0x87b5e0, 60, 160);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const sun = new THREE.DirectionalLight(0xfff2d0, 1.2);
sun.position.set(30, 50, 20);
scene.add(sun);
const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x4a7a30, 0.9);
scene.add(hemi);
// ---------- Ground ----------
const LAWN = 90, HALF = LAWN / 2;
let dirtMat, lawnMat;
const dirt = new THREE.Mesh(
  new THREE.PlaneGeometry(600, 600),
  (dirtMat = new THREE.MeshLambertMaterial({ color: 0x8a6b45 }))
);
dirt.rotation.x = -Math.PI / 2;
dirt.position.y = -0.05;
scene.add(dirt);

const lawn = new THREE.Mesh(
  new THREE.BoxGeometry(LAWN, 0.3, LAWN),
  (lawnMat = new THREE.MeshLambertMaterial({ color: 0x3e7a24 }))
);lawn.position.y = -0.15;
scene.add(lawn);

// ---------- Grass (instanced + wind shader) ----------
const SPACING = 0.42;
const cols = Math.floor(LAWN / SPACING);
const COUNT = cols * cols;

const geo = new THREE.PlaneGeometry(0.22, 1.1, 1, 3);
geo.translate(0, 0.5, 0);

const offsets = new Float32Array(COUNT * 3);
const randoms = new Float32Array(COUNT * 2);
const heights = new Float32Array(COUNT);
const px = new Float32Array(COUNT);
const pz = new Float32Array(COUNT);

// obstacles (trees) â€” grass is skipped inside their radius
const trees = [];
const trunkMat = new THREE.MeshLambertMaterial({ color: 0x6b4a2b });
const crownMat = new THREE.MeshLambertMaterial({ color: 0x2d6a1e });
const rockMat = new THREE.MeshLambertMaterial({ color: 0x8d8d93 });
const caveMat = new THREE.MeshLambertMaterial({ color: 0x121215 });
const caves = [];

// tree builder must exist before buildProps (hoisted, no-op reorder safe)
function addTree(x, z, r) {
  trees.push({ x, z, r });
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.5, 3, 8), trunkMat);
  trunk.position.y = 1.5;
  const crown = new THREE.Mesh(new THREE.SphereGeometry(2.4, 10, 8), crownMat);
  crown.position.y = 4.2;
  crown.scale.y = 1.15;
  g.add(trunk, crown);
  g.position.set(x, 0, z);
  scene.add(g);
}
addTree(-25, -20, 2.2);
addTree(28, 12, 2.4);
addTree(-8, 30, 2.0);
addTree(15, -32, 2.3);
addTree(-35, 22, 2.1);

// ---------- Rocks to dodge while mowing ----------
const rockMatL = new THREE.MeshLambertMaterial({ color: 0x77777d, flatShading: true });
function addRock(x, z, r) {
  const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 0), rockMatL);
  rock.scale.y = 0.7;
  rock.position.set(x, r * 0.3, z);
  rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
  scene.add(rock);
  propObjs.push(rock);
  trees.push({ x, z, r: r * 0.9 }); // solid collision + grass skipped
}
function buildProps(treesLayout, rockLayout, caveLayout) {
  // tear down props from a previous layout
  for (const o of propObjs) scene.remove(o);
  propObjs.length = 0;
  trees.length = 0;
  trees.push({ x: 0, z: 0, r: 3.0 }); // chicken coop collision (built below)
  // trees
  for (const [x, z, r] of treesLayout) addTree(x, z, r);
  // rocks
  for (const [x, z, r] of rockLayout) addRock(x, z, r);
  // chicken coop (center of the map)
  const coop = new THREE.Group();
  const woodMat = new THREE.MeshLambertMaterial({ color: 0x9c6b3f });
  const darkWood = new THREE.MeshLambertMaterial({ color: 0x6e4a28 });
  const walls = new THREE.Mesh(new THREE.BoxGeometry(5, 2.2, 3.5), woodMat);
  walls.position.y = 1.6;
  const roofL = new THREE.Mesh(new THREE.BoxGeometry(5.8, 0.16, 2.2), darkWood);
  roofL.position.set(0, 3.25, -0.95);
  roofL.rotation.x = 0.62;
  const roofR = roofL.clone();
  roofR.position.z = 0.95;
  roofR.rotation.x = -0.62;
  const door = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.5), new THREE.MeshLambertMaterial({ color: 0x1e120a }));
  door.position.set(0, 0.95, 1.76);
  const ramp = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.08, 1.5), darkWood);
  ramp.position.set(0, 0.35, 2.35);
  ramp.rotation.x = -0.5;
  coop.add(walls, roofL, roofR, door, ramp);
  scene.add(coop);
  propObjs.push(coop);
  // gnome caves
  caves.length = 0;
  for (const [cx, cz] of caveLayout) {
    const cave = new THREE.Group();
    const mound = new THREE.Mesh(new THREE.SphereGeometry(2.6, 12, 9), rockMat);
    mound.scale.y = 0.55;
    mound.position.y = 0.2;
    const mouth = new THREE.Mesh(new THREE.CircleGeometry(1.05, 18), caveMat);
    mouth.position.set(0, 0.75, 1.9);
    cave.add(mound, mouth);
    cave.position.set(cx, 0, cz);
    cave.lookAt(0, 0, 0);
    scene.add(cave);
    caves.push({ x: cx, z: cz });
    trees.push({ x: cx, z: cz, r: 2.4 });
  }
  // re-skip grass under the new obstacles
  for (let j = 0; j < COUNT; j++) {
    let skip = false;
    for (const tr of trees) {
      const dx = px[j] - tr.x, dz = pz[j] - tr.z;
      if (dx * dx + dz * dz < (tr.r + 0.4) ** 2) { skip = true; break; }
    }
    heights[j] = skip ? 0 : pristineHeights[j];
  }
  heightAttr.needsUpdate = true;
}
const propObjs = [];

// ---------- Chickens ----------
const chickens = [];
function makeChicken() {
  const g = new THREE.Group();
  const white = new THREE.MeshLambertMaterial({ color: 0xf5f0e6 });
  const red = new THREE.MeshLambertMaterial({ color: 0xd23a2a });
  const orange = new THREE.MeshLambertMaterial({ color: 0xe8942a });
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 10), white);
  body.scale.set(1, 0.9, 1.35);
  body.position.y = 0.48;
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.4, 6), white);
  tail.position.set(0, 0.42, -0.38);
  tail.rotation.x = 0.9;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), white);
  head.position.set(0, 0.62, 0.32);
  const comb = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.14, 0.16), red);
  comb.position.set(0, 0.76, 0.28);
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.16, 6), orange);
  beak.position.set(0, 0.6, 0.44);
  beak.rotation.x = Math.PI / 2;
  const wattle = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 5), red);
  wattle.position.set(0, 0.52, 0.38);
  const legMat = orange;
  const legs = [];
  for (const sx of [-0.1, 0.1]) {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.32, 6), legMat);
    leg.position.set(sx, 0.16, 0);
    g.add(leg);
    legs.push(leg);
  }
  g.add(body, tail, head, comb, beak, wattle);
  g.userData = { legs, head, comb, beak, wattle, heading: Math.random() * Math.PI * 2, speed: 0, timer: Math.random() * 3, panic: 0, headY: 0 };
  const a = 4.5 + Math.random() * 8;
  const b = Math.random() * Math.PI * 2;
  g.position.set(Math.sin(b) * a, 0, Math.cos(b) * a);
  g.rotation.y = g.userData.heading;
  scene.add(g);
  chickens.push(g);
}
function seedChickens() {
  for (let n = chickens.length, end = chickens.length + 7; n < end; n++) {
    makeChicken();
    chickens[chickens.length - 1].userData.netId = n;
  }
}
seedChickens();

function updateChickens(dt, t) {
  // threat = whichever character the player is controlling
  const threat = mode === 'mow' ? mower : man;
  for (const c of chickens) {
    const u = c.userData;
    if (u.carried) continue; // hanging in a gnome's arms
    const dx = c.position.x - threat.position.x;
    const dz = c.position.z - threat.position.z;
    const d = Math.hypot(dx, dz);

    // flee from the player or any nearby gnome
    let threatX = threat.position.x, threatZ = threat.position.z, bestD = d;
    for (const tw of remotePlayers.values()) {
      const s = tw.s; if (!s) continue;
      const tX = s.m === 'mow' ? s.x : s.mx;
      const tZ = s.m === 'mow' ? s.z : s.mz;
      const pd = Math.hypot(c.position.x - tX, c.position.z - tZ);
      if (pd < bestD) { bestD = pd; threatX = tX; threatZ = tZ; }
    }
    for (const gn of gnomes) {
      if (gn.userData.flying || gn.userData.landed > 0) continue;
      const gd = Math.hypot(c.position.x - gn.position.x, c.position.z - gn.position.z);
      if (gd < bestD) { bestD = gd; threatX = gn.position.x; threatZ = gn.position.z; }
    }
    if (bestD < 4) {
      u.heading = Math.atan2(c.position.x - threatX, c.position.z - threatZ);
      u.speed = 4.2;
      u.panic = 2;
    } else if (u.panic > 0) {
      u.panic -= dt;
      u.speed = u.panic > 0 ? 3 : 0;
    } else {
      // wander: occasionally pick a new direction / stop to peck
      u.timer -= dt;
      if (u.timer <= 0) {
        u.timer = 1.5 + Math.random() * 3.5;
        if (Math.random() < 0.7) { u.heading = Math.random() * Math.PI * 2; u.speed = 1; }
        else u.speed = 0;
      }
    }

    // head back to the coop if strayed too far
    if (u.panic <= 0 && Math.hypot(c.position.x, c.position.z) > 20) {
      u.heading = Math.atan2(-c.position.x, -c.position.z);
      u.speed = 1.2;
    }

    // stay on the lawn
    const limC = HALF - 5;
    if (Math.abs(c.position.x) > limC || Math.abs(c.position.z) > limC) {
      u.heading = Math.atan2(-c.position.x, -c.position.z);
    }
    // don't walk into the coop
    if (Math.hypot(c.position.x, c.position.z) < 3.4) {
      u.heading = Math.atan2(c.position.x, c.position.z);
    }

    c.rotation.y = u.heading;
    c.position.x += Math.sin(u.heading) * u.speed * dt;
    c.position.z += Math.cos(u.heading) * u.speed * dt;

    // leg scrambling + head bob / peck when idle
    const amp2 = Math.min(1, u.speed / 2);
    const scurry = t * 14 * Math.max(amp2, u.speed > 0 ? 0.4 : 0);
    u.legs[0].rotation.x = Math.sin(scurry) * 0.7 * amp2;
    u.legs[1].rotation.x = -Math.sin(scurry) * 0.7 * amp2;
    if (u.speed === 0 && u.panic <= 0) {
      u.headY = Math.max(0, Math.sin(t * 6) * 0.5 - 0.3); // pecking
    } else {
      u.headY = 0;
    }
    u.head.position.y = 0.62 - u.headY * 0.9;
    u.comb.position.y = 0.76 - u.headY * 0.9;
    u.beak.position.y = 0.6 - u.headY * 0.9;
    u.wattle.position.y = 0.52 - u.headY * 0.9;
    c.position.y = Math.abs(Math.sin(scurry)) * 0.03 * amp2;
  }
  // occasional chicken voices
  chickVoiceT -= dt;
  if (chickVoiceT <= 0 && chickens.length) {
    const c0 = chickens[Math.floor(Math.random() * chickens.length)];
    if (!c0.userData.carried) {
      if (c0.userData.panic > 0 || c0.userData.speed > 2) sfxSquawk();
      else sfxCluck();
    }
    chickVoiceT = 1.5 + Math.random() * 3.5;
  }
}

// ---------- Evil lawn gnomes ----------
const gnomes = [];
let gnomeSeq = 0;
let gnomeTimer = 10;
const sgAuto = new URLSearchParams(location.search).has('sgauto'); // debug: auto-hit nearest gnome
if (sgAuto) setInterval(() => {
  let best = null, bd = Infinity;
  for (const g of gnomes) { const d = g.position.distanceTo(man.position); if (d < bd) { bd = d; best = g; } }
  if (best) batHit({ x: best.position.x - 10, z: best.position.z }, Math.atan2(10, 0));
}, 500);
const gnomeParam = new URLSearchParams(location.search).get('gnome');
if (gnomeParam !== null) gnomeTimer = isNaN(+gnomeParam) ? 0 : +gnomeParam; // debug: ?gnome=0 spawns immediately
let swingT = 0;
let stepAcc = 0;
let gnomeVoiceT = 0;
let chickVoiceT = 0;

function spawnGnome(forcePlain) {
  const sgCh = new URLSearchParams(location.search).get('sg');
  const superChance = sgCh !== null ? +sgCh || 0 : 0.02; // 1 in 50 spawns is a super (host decides)
  const superG = forcePlain ? false : Math.random() < superChance; // host decides supers
  if (superG) { superToastPending = true; showSuperToast(); }
  const g = new THREE.Group();
  // squat little body
  const robe = new THREE.Mesh(new THREE.ConeGeometry(0.38, 0.8, 12), new THREE.MeshLambertMaterial({ color: superG ? 0x17121e : 0x2f5fc4 }));
  robe.position.y = 0.42;
  // big round belly for the classic fat-gnome look
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 10), new THREE.MeshLambertMaterial({ color: superG ? 0x17121e : 0x2f5fc4 }));
  belly.position.set(0, 0.5, 0.04);
  g.add(belly);
  // boots peeking out under the robe
  for (const sx of [-0.12, 0.12]) {
    const boot = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 5), new THREE.MeshLambertMaterial({ color: 0x1a1a1a }));
    boot.scale.set(1.3, 0.6, 1.6);
    boot.position.set(sx, 0.06, 0.08);
    g.add(boot);
  }
  // belt around the belly
  const belt = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.1, 14), new THREE.MeshLambertMaterial({ color: 0x3a2410 }));
  belt.position.y = 0.5;
  // head
  const gnomesHead = new THREE.Mesh(new THREE.SphereGeometry(0.17, 10, 8), skin);
  gnomesHead.position.y = 0.95;
  // big round nose sticking out
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), skin);

  // fluffy white beard
  const beard = new THREE.Mesh(new THREE.SphereGeometry(0.19, 10, 8), new THREE.MeshLambertMaterial({ color: 0xf5f5f0 }));
  beard.scale.set(1.1, 1.4, 0.7);

  const gnomesHat = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.75, 12), new THREE.MeshLambertMaterial({ color: superG ? 0xd9482b : 0xd23a2a }));
  gnomesHat.position.y = 1.35;
  gnomesHat.rotation.x = -0.22;
  gnomesHat.rotation.z = 0.15;
  // stubby little arms resting on the belly
  for (const sx of [-0.34, 0.34]) {
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.28, 6), new THREE.MeshLambertMaterial({ color: 0x2f5fc4 }));
    arm.position.set(sx, 0.62, 0.25);
    arm.rotation.z = sx * 1.6;
    arm.rotation.x = -0.5;
    g.add(arm);
  }
  g.add(robe, belly, belt, gnomesHead, nose, beard, gnomesHat);
  // emerge from a random cave
  const cave = caves[Math.floor(Math.random() * caves.length)];
  const cl = Math.hypot(cave.x, cave.z) || 1;
  g.position.set(cave.x - cave.x / cl * 3.2, 0, cave.z - cave.z / cl * 3.2);
  g.userData = { flying: false, v: new THREE.Vector3(), landed: 0, attackT: 0, carrying: null, netId: ++gnomeSeq, super: superG, hp: superG ? 10 : 1, stun: 0 };
  if (superG) g.scale.setScalar(5); // 5x physical size
  scene.add(g);
  gnomes.push(g);
}

function nearestCave(x, z) {
  let best = caves[0], bd = Infinity;
  for (const c of caves) {
    const d2 = (c.x - x) ** 2 + (c.z - z) ** 2;
    if (d2 < bd) { bd = d2; best = c; }
  }
  return best;
}

function batHit(attacker = man, heading = walkCtl.heading) {
  const h = heading;
  const ax = attacker === man ? man.position.x : attacker.x;
  const az = attacker === man ? man.position.z : attacker.z;
  const fh = Math.sin(h), fh2 = Math.cos(h);
  for (const g of gnomes) {
    const u = g.userData;
    if (u.flying || u.landed > 0 || u.stun > 0) continue;
    const dx = g.position.x - ax;
    const dz = g.position.z - az;
    const d = Math.hypot(dx, dz);
    // super gnomes are huge: bigger reach needed to connect
    if (d > (u.super ? 12 : 2.4)) continue;
    if ((dx * fh + dz * fh2) / (d || 1) <= 0.05) continue;
    if (u.super && u.hp > 1) {
      // stagger, don't launch: needs 10 hits, 1 of 20 spawns
      u.hp--;
      u.stun = 0.9;
      u.flying = true; // brief knock-up, lands standing again
      sfxHit();
      u.v.set(fh * 6 + (Math.random() - 0.5) * 2, 7 + Math.random() * 2, fh2 * 6 + (Math.random() - 0.5) * 5);
      g.position.y = 0.3;
      continue;
    }
    u.flying = true;
    sfxHit();
    if (u.super) u.hp = 0; // final blow
    u.v.set(fh * 17 + (Math.random() - 0.5) * 5, 10 + Math.random() * 5, fh2 * 17 + (Math.random() - 0.5) * 5);
    g.position.y = 0.5;
  }
}

function updateGnomes(dt, t) {
  if (started && !won) {
    gnomeTimer -= dt;
    // spawn pressure scales with lawn progress: 1/4 rate early, full rate in the last 10%
    const p = cutCount / total;
    const f = p < 0.9 ? 0.25 + 0.75 * (p / 0.9) : 1;
    // scales 2.25x per player: 1x solo, 2.25x duo, ~5x trio...
    const pc = 1 + remotePlayers.size;
    const scale = Math.pow(2.25, pc - 1);
    const maxGnomes = Math.max(1, Math.min(40, Math.round(Math.min(1 + elapsed / 25, 6) * f * scale)));
    if (gnomeTimer <= 0 && gnomes.length < maxGnomes) {
      gnomeTimer = Math.max(1.5, 8 - elapsed / 15) / f / scale;
      spawnGnome();
    }
  }
  for (let gi = gnomes.length - 1; gi >= 0; gi--) {
    const g = gnomes[gi];
    const u = g.userData;
    const sp = (4.8 + elapsed * 0.004) * (u.super ? 0.7 : 1); // supers lumber
    if (u.flying) {
      u.v.y -= 22 * dt;
      g.position.addScaledVector(u.v, dt);
      g.rotation.x += dt * 14;
      if (g.position.y <= 0.05 && u.v.y < 0) {
        u.flying = false;
        g.position.y = 0;
        g.rotation.x = Math.PI / 2; // knocked flat
        // drop any chicken it was carrying â€” it's rescued
        if (u.carrying) {
          const held = u.carrying;
          u.carrying = null;
          held.userData.carried = false;
          held.userData.by = '';
          held.visible = true;
          g.remove(held);
          held.position.copy(g.position);
          held.position.y = 0;
          held.rotation.set(0, held.rotation.y, 0);
          held.scale.setScalar(1);
          scene.add(held);
          held.userData.panic = 3;
        }
        if (u.super && u.hp > 0) {
          u.stun = 0.9; // super falls hard, gets up and keeps hunting
        } else {
          u.landed = 0.9;
        }
      }
      continue;
    }
    if (u.landed > 0) {
      u.landed -= dt;
      if (u.landed <= 0) { scene.remove(g); gnomes.splice(gi, 1); }
      continue;
    }
    if (u.stun > 0) {
      u.stun -= dt;
      if (u.stun <= 0) g.rotation.x = 0; // stands back up
      continue;
    }
    if (u.carrying) {
      // haul the chicken back to the nearest cave
      const cv = nearestCave(g.position.x, g.position.z);
      const dx = cv.x - g.position.x, dz = cv.z - g.position.z;
      const d = Math.hypot(dx, dz);
      g.rotation.y = Math.atan2(dx, dz);
      if (d < 2.4) {
        // delivered â€” chicken is gone for good, gnome vanishes inside
        const ci = chickens.indexOf(u.carrying);
        if (ci >= 0) chickens.splice(ci, 1);
        scene.remove(u.carrying);
        scene.remove(g);
        gnomes.splice(gi, 1);
      } else {
        const carrySpeed = sp * 0.55; // weighed down by its catch
        g.position.x += dx / d * carrySpeed * dt;
        g.position.z += dz / d * carrySpeed * dt;
        g.rotation.z = Math.sin(t * 14) * 0.1;
      }
      continue;
    }
    // hunt the nearest free chicken; a man carrying one is an attackable target when close
    let target = null, best = Infinity, stealFromMan = false;
    let cx0 = 0, cz0 = 0, carrierId = null, carrierD = Infinity;
    for (const c of chickens) {
      if (c.userData.carried) continue;
      if (c.userData.by) {
        const rawId = c.userData.by;
        let px = null, pz = null;
        if (rawId === myPlayerId) { px = man.position.x; pz = man.position.z; }
        else {
          const tw = remotePlayers.get(rawId);
          const s = tw && tw.s;
          if (s && s.m === 'walk') { px = s.mx; pz = s.mz; }
        }
        if (px !== null) {
          const d2 = (px - g.position.x) ** 2 + (pz - g.position.z) ** 2;
          if (d2 < carrierD) { carrierD = d2; cx0 = px; cz0 = pz; carrierId = rawId; if (d2 < 49) stealFromMan = true; }
        }
        continue;
      }
      const d2 = c.position.distanceToSquared(g.position);
      if (d2 < best) { best = d2; target = c; }
    }
    if ((!target || stealFromMan) && carrierId !== null && (!target || carrierD < best)) {
      const dzm = cz0 - g.position.z, dxm = cx0 - g.position.x;
      const dm = Math.hypot(dxm, dzm) || 1;
      g.rotation.y = Math.atan2(dxm, dzm);
      if (dm > 0.85) {
        g.position.x += dxm / dm * sp * dt;
        g.position.z += dzm / dm * sp * dt;
        g.rotation.z = Math.sin(t * 12) * 0.1;
      } else {
        // shoulder-check: the carrier is knocked away, the chicken drops loose
        if (carrierId === myPlayerId) {
          man.position.x += dxm / dm * 2.6;
          man.position.z += dzm / dm * 2.6;
          man.position.x = THREE.MathUtils.clamp(man.position.x, -HALF + 2, HALF - 2);
          man.position.z = THREE.MathUtils.clamp(man.position.z, -HALF + 2, HALF - 2);
          const dropped = mowCarryId !== null ? mowCarryChicken() : null;
          manDropChicken();
          if (dropped) gnomeTakeChicken(g, dropped);
        } else {
          const gdx = dxm / dm, gdz = dzm / dm;
          sendAll({ t: 'steal', id: carrierId, dx: gdx, dz: gdz });
          const st = chickens.find(k => k.userData.by === carrierId);
          if (st) {
            st.userData.by = '';
            st.userData.panic = 2;
            gnomeTakeChicken(g, st);
          }
        }
      }
      continue;
    }
    if (!target) continue;
    const dx2 = target.position.x - g.position.x, dz2 = target.position.z - g.position.z;
    g.rotation.y = Math.atan2(dx2, dz2);
    const d = Math.sqrt(best);
    if (d > 0.75) {
      g.position.x += dx2 / d * sp * dt;
      g.position.z += dz2 / d * sp * dt;
      g.rotation.z = Math.sin(t * 12) * 0.1;
      u.attackT = 0;
      gnomeVoiceT -= dt;
      if (gnomeVoiceT <= 0) { sfxGnome(); gnomeVoiceT = 1.5 + Math.random() * 2.5; }
    } else {
      // snatch the chicken and run for the cave
      u.carrying = target;
      target.userData.carried = true;
      g.add(target);
      target.position.set(0, 1.05, -0.1); // dangling in the gnome's arms
      target.rotation.set(0, 0, 0);
      target.rotation.z = 0.6; // limp, upside-down-ish
      target.scale.setScalar(0.75);
      u.attackT = 0;
    }
  }
}

// spatial hash for fast cut detection
const CELL = 2.0;

    const z = -HALF + gz * SPACING + (Math.random() - 0.5) * SPACING * 0.7;
    px[i] = x; pz[i] = z;
    offsets[i * 3] = x; offsets[i * 3 + 1] = 0; offsets[i * 3 + 2] = z;
    randoms[i * 2] = Math.random(); randoms[i * 2 + 1] = Math.random();
    heights[i] = 0.85 + Math.random() * 0.35;
    let skip = false;
    for (const t of trees) {

    }
    if (skip) heights[i] = -1; // never exists
    const k = key(Math.floor((x + HALF) / CELL), Math.floor((z + HALF) / CELL));
    let arr = grid.get(k);
    if (!arr) { arr = []; grid.set(k, arr); }
    arr.push(i);
  }
}

  vertexShader: /* glsl */`
    attribute vec3 aOffset;
    attribute vec2 aRandom;
    attribute float aHeight;
    uniform float uTime;
    varying float vY;
    varying float vRand;
    varying float vH;
    void main() {

      pos.xz *= 1.0 - t * 0.85;            // taper toward tip

      float sway = wind * (0.22 + gust * 0.38) * t * t * aHeight;
      pos.x += sway;
      pos.z += sway * 0.55;
      vec3 world = pos + aOffset;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(world, 1.0);
    }`,
  fragmentShader: /* glsl */`
    varying float vY;
    varying float vRand;
    varying float vH;
    uniform vec3 uRoot;

    void main() {
      vec3 root = uRoot.rgb;

    }`

const pMat = new THREE.MeshBasicMaterial({ color: 0x7ecf3f, side: THREE.DoubleSide });
const parts = [];
for (let p = 0; p < MAXP; p++) {
  const m = new THREE.Mesh(pGeo, pMat);
  m.visible = false;
  scene.add(m);
  parts.push({ m, vx: 0, vy: 0, vz: 0, life: 0 });
}
let pIdx = 0;
function spawnClip(x, z) {
  const p = parts[pIdx++ % MAXP];
  p.m.visible = true;
  p.m.position.set(x, 0.5, z);
  p.vx = (Math.random() - 0.5) * 4; p.vy = 2.5 + Math.random() * 3; p.vz = (Math.random() - 0.5) * 4;
  p.life = 0.8;
}

// ---------- State ----------
let mode = 'walk'; // 'walk' = controlling the man, 'mow' = gripping the mower
const mowCtl = { heading: Math.PI, speed: 0 };
const walkCtl = { heading: Math.PI, speed: 0 };
let mouseDown = false;
addEventListener('mousedown', () => {
  mouseDown = true;
  startMusic();
  // away from the mower handle, a click swings the bat
  const hx = mower.position.x - Math.sin(mowCtl.heading) * 1.5;
  const hz = mower.position.z - Math.cos(mowCtl.heading) * 1.5;
  const nearHandle = Math.hypot(man.position.x - hx, man.position.z - hz) < 2.4;
  if (mode === 'walk' && !nearHandle && swingT <= 0) {
    swingT = 0.4;
    sfxSwing();
    if (isGuest) sendAll({ t: 'sw', x: man.position.x, z: man.position.z, h: walkCtl.heading });
    else batHit();
  }
});
addEventListener('mouseup', () => { mouseDown = false; });
let cutCount = 0;
let total = 0;
for (let j = 0; j < COUNT; j++) if (heights[j] > 0) total++;
const baseHeights = heights.slice(); // pristine lawn, for round restarts
let started = false, won = false, elapsed = 0;
const forceStart = new URLSearchParams(location.search).has('start');

const keys = {};
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return; // don't hijack the room code field
  keys[e.code] = true; if (e.code === 'KeyR') location.reload(); startMusic();
});
addEventListener('keyup', e => { if (e.target && e.target.tagName === 'INPUT') return; keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ---------- Cut detection ----------
function cutGrass() {
  const r = 1.15, r2 = r * r;
  const cx = Math.floor((mower.position.x + HALF) / CELL);
  const cz = Math.floor((mower.position.z + HALF) / CELL);
  let changed = false;
  for (let ox = -1; ox <= 1; ox++) for (let oz = -1; oz <= 1; oz++) {
    const arr = grid.get(key(cx + ox, cz + oz));
    if (!arr) continue;
    for (const idx of arr) {
      const h = heights[idx];
      if (h > 0.1) {
        const dx = px[idx] - mower.position.x, dz = pz[idx] - mower.position.z;
        if (dx * dx + dz * dz < r2) {
          heights[idx] = 0.08;
          cutCount++;
          changed = true;
          if (isHost) pendingNetCut.push(idx); else netCutIdx.push(idx);
          if (Math.random() < 0.15) spawnClip(px[idx], pz[idx]);
        }
      }
    }
  }
  if (changed) heightAttr.needsUpdate = true;
}

let audioCtx = null;
let audioMaster = null;
let soundsReady = false;
let musicNodes = null;

function b64ToArrayBuffer(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

async function startMusic() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();
  const master = audioCtx.createGain();
  master.gain.value = 0.35;
  // heavy master compression: smooths harsh peaks (hits, squawks, engine)
  const comp = audioCtx.createDynamicsCompressor();
  comp.threshold.value = -24;
  comp.knee.value = 24;
  comp.ratio.value = 8;
  comp.attack.value = 0.003;
  comp.release.value = 0.3;
  comp.connect(audioCtx.destination);
  master.connect(comp);
  audioMaster = master;

  // decode all embedded mp3s
  const jobs = Object.entries(SOUND_DATA).map(async ([name, b64]) => {
    SND[name] = await audioCtx.decodeAudioData(b64ToArrayBuffer(b64));
  });
  await Promise.all(jobs);
  soundsReady = true;

  // looping soundtrack
  const src = audioCtx.createBufferSource();
  src.buffer = SND.music;
  src.loop = true;
  const g = audioCtx.createGain();
  g.gain.value = 0.55;
  src.connect(g);
  g.connect(audioMaster);
  src.start();
  musicNodes = { src, g };
}

function playBuf(name, vol = 1, rate = 1) {
  if (!audioCtx || !soundsReady || !SND[name]) return;
  const src = audioCtx.createBufferSource();
  src.buffer = SND[name];
  src.playbackRate.value = rate;
  const g = audioCtx.createGain();
  g.gain.value = vol;
  src.connect(g);
  g.connect(audioMaster);
  src.start();
}

// ---------- Sound effects (sampled) ----------
const SND = {}; // decoded buffers: music, engine, gnome, cluck, squawk, hit, swing, step

function sfxStep() { playBuf('step', 0.55, 0.85 + Math.random() * 0.3); }
function sfxSwing() { playBuf('swing', 0.9, 0.95 + Math.random() * 0.1); }
function sfxHit() { playBuf('hit', 1, 0.92 + Math.random() * 0.12); }
function sfxGnome() { playBuf('gnome', 0.85, 0.85 + Math.random() * 0.3); }
function sfxCluck() { playBuf('cluck', 0.75, 0.9 + Math.random() * 0.3); }
function sfxSquawk() { playBuf('squawk', 0.9, 0.95 + Math.random() * 0.1); }

// mower engine
let engineNodes = null;
function startEngine() {
  const src = audioCtx.createBufferSource();
  src.buffer = SND.engine;
  src.loop = true;
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 600;
  const gain = audioCtx.createGain();
  gain.gain.value = 0;
  src.connect(lp);
  lp.connect(gain);
  gain.connect(audioMaster);
  src.start();
  engineNodes = { gain, src };
}

const stickEl = document.getElementById('stick');
const knobEl = document.getElementById('knob');
const actBtn = document.getElementById('actBtn');
const actLabel = document.getElementById('actLabel');
let isTouch = false;
const joy = { id: null, baseX: 0, baseY: 0, x: 0, y: 0, mag: 0 };
let touchGrip = false;
const STICK_R = 52;

function showTouchUI() {
  isTouch = true;
  stickEl.style.display = 'block';
  actBtn.style.display = 'flex';
  helpEl.textContent = 'STICK drive/steer | PUSH FAR for boost | GRAB mower to mow';
}
addEventListener('touchstart', () => { if (!isTouch) { showTouchUI(); startMusic(); } }, { passive: true, once: true });

function joyUpdate(t) {
  const dx = t.clientX - joy.baseX, dy = t.clientY - joy.baseY;
  const len = Math.hypot(dx, dy) || 1;
  const mag = Math.min(1, len / STICK_R);
  joy.x = (dx / len) * mag; joy.y = (dy / len) * mag;
  joy.mag = mag;
  const k = len / Math.max(len, STICK_R);
  knobEl.style.transform = 'translate(-50%,-50%) translate(' + (dx * k) + 'px,' + (dy * k) + 'px)';
}
addEventListener('touchstart', e => {
  if (!isTouch || !ready) return; // inert while the menu is open
  for (const t of e.changedTouches) {
    if (t.clientX < innerWidth * 0.55 && joy.id === null) {
      e.preventDefault();
      joy.id = t.identifier;
      joy.baseX = t.clientX; joy.baseY = t.clientY;
      joyUpdate(t);
    }
  }
}, { passive: false });
addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) {
      joyUpdate(t);
      e.preventDefault();
    }
  }
}, { passive: false });
function joyEnd(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) {
      joy.id = null; joy.x = 0; joy.y = 0; joy.mag = 0;
      knobEl.style.transform = 'translate(-50%,-50%)';
    }
  }
}
addEventListener('touchend', joyEnd);
addEventListener('touchcancel', joyEnd);

actBtn.addEventListener('touchstart', e => {
  e.preventDefault(); e.stopPropagation();
  const hx = mower.position.x - Math.sin(mowCtl.heading) * 1.5;
  const hz = mower.position.z - Math.cos(mowCtl.heading) * 1.5;
  const nearHandle = Math.hypot(man.position.x - hx, man.position.z - hz) < 2.4;
  if (mode === 'mow') touchGrip = false;
  else if (nearHandle) touchGrip = true;
  else if (swingT <= 0) {
    swingT = 0.4;
    sfxSwing();
    if (isGuest) sendAll({ t: 'sw', x: man.position.x, z: man.position.z, h: walkCtl.heading });
    else batHit();
  }
}, { passive: false });

function sendAll(msg) {

document.getElementById('btnHost').onclick = () => {
  document.getElementById('btnHost').disabled = true;
  document.getElementById('btnSolo').disabled = true;
  openMenuStatus('Starting host...');
  const words = 'mow lawn grass penguin tiger rocket pony bacon castle mango cactus pixel ninja muffin professor octopus nugget donut comet moon waffle gnome chicken fence sprinkler gopher butter turkey yogurt wiggle spring cookie beaver puzzle tractor bucket rainbow dolphin wombat pickle mustard hammock lantern popcorn wizard banana harbor. tractor'.split(' ');
  const pool = Array.from(new Set(words.map(w => w.replace(/[^a-z]/g, '')).filter(Boolean)));
  // three-word room code; retry if taken
  function hostTry() {
    let a = Math.floor(Math.random() * pool.length), b, c;
    do { b = Math.floor(Math.random() * pool.length); } while (b === a);
    do { c = Math.floor(Math.random() * pool.length); } while (c === a || c === b);
    const code = pool[a] + '-' + pool[b] + '-' + pool[c];
    const p = new Peer(code);
    peer = p;
    p.on('open', () => {
      isHost = true;
      document.getElementById('roomCode').textContent = code;
      document.getElementById('roomTag').style.display = 'block';
      openMenuStatus('Room code: ' + code + ' â€” share it! Players can join any time while you mow.');
      p.on('connection', c => {
        conns.add(c);
        c.on('open', () => {
          // late joiners: sync the full cut state of the lawn
          const full = [];
          for (let j = 0; j < COUNT; j++) if (heights[j] > 0.01 && heights[j] < 0.5) full.push(j);
          if (full.length && c.open) c.send({ t: 'c', d: full });
        });
        c.on('data', d => { d._conn = c; hostOnData(d); });
        c.on('close', () => {
          conns.delete(c);
          for (const [id, tw] of remotePlayers) {
            if (tw.conn === c) { scene.remove(tw.rm, tw.rn); remotePlayers.delete(id); }
          }
        });
      });
      closeMenu();
    });
    p.on('error', e => {
      if (e.type === 'unavailable-id') { p.destroy(); hostTry(); }
      else openMenuStatus('Host error: ' + e.type);
    });
  }
  hostTry();
};

document.getElementById('btnJoin').onclick = () => {
  const codeEl = document.getElementById('joinCode');
  const code = codeEl.value.trim().toLowerCase();
  if (!code || code.split('-').length !== 3) { openMenuStatus('Enter the 3-word room code, e.g. mow-lawn-grass'); return; }
  document.getElementById('btnJoin').disabled = true;
  document.getElementById('btnSolo').disabled = true;
  openMenuStatus('Connecting to ' + code + '...');
  const p = new Peer();
  peer = p;
  p.on('open', () => {
    const c = p.connect(code, { reliable: true });
    peerConn = c;
    c.on('open', () => {
      isGuest = true; isHost = false;
      closeMenu();
      openMenuStatus('');
    });
    c.on('data', d => guestOnData(d));
    c.on('close', () => { isGuest = false; openMenuStatus('Disconnected from host'); });
    c.on('error', e => openMenuStatus('Connection error'));
  });
  p.on('error', e => openMenuStatus('Join error: ' + e.type));
  closeMenu(); // roam solo until connected
};

function playerNetState() {
  return {
    t: 'p', id: myPlayerId, m: mode,
    mx: man.position.x, mz: man.position.z, mh: walkCtl.heading,
    x: mower.position.x, z: mower.position.z, h: mowCtl.heading,
    sp: Math.abs(mode === 'mow' ? mowCtl.speed : walkCtl.speed)
  };
}

// guest side ---------------------------------------------------------------
function guestOnData(d) {
  if (d.t === 'p') {
    if (d.id === myPlayerId) return;
    const tw = twinFor(d.id);
    tw.s = d;
  } else if (d.t === 'c') {
    applyCutList(d.d);
  } else if (d.t === 's') {
    netElapsed = d.e;
    cutCount = d.cc;
    if (d.sgToast) showSuperToast();
    if (d.restartIn !== undefined) restartT = d.restartIn;
    if (d.thm) applyTheme(d.thm);
    for (const p of d.pl) {
      if (p.id !== myPlayerId) twinFor(p.id).s = p;
    }
    // chickens/gnomes: host is authority — sync by stable id, store targets for per-frame glide
    const seenCh = new Set();
    for (const e of d.ch) {
      const c = chickens.find(k => k.userData.netId === e[0]);
      if (!c) continue;
      if (e[4]) { c.visible = false; (c.parent || scene).remove(c); continue; } // carried in a gnome's arms
      seenCh.add(e[0]);
      c.visible = true;
      c.userData.by = e[3] || '';
      c.userData.tx = e[1]; c.userData.tz = e[2];
      c.rotation.y = e[5];
      if (e[3] === myPlayerId) {
        mowCarryId = e[0]; // the man you sent to grab it confirmed
      } else if (mowCarryId === e[0] && e[3] && e[3] !== myPlayerId) {
        mowCarryId = null; // someone else grabbed it first
      }
    }
    for (let i = chickens.length - 1; i >= 0; i--) {
      const c = chickens[i];
      if (!seenCh.has(c.userData.netId)) {
        scene.remove(c);
        chickens.splice(i, 1);
      }
    }
    // gnomes: reconcile by stable id, store targets
    const seenGn = new Set();
    for (const e of d.gn) {
      let g = gnomes.find(x => x.userData.netId === e[0]);
      if (!g) {
        spawnGnome(true); // host decides supers; guests render plain and mirror
        g = gnomes[gnomes.length - 1];
        g.userData.netId = e[0];
      }
      seenGn.add(e[0]);
      g.userData.tx = e[1]; g.userData.tz = e[2]; g.userData.ty = e[3];
      g.rotation.y = e[4];
      const su = !!e[6];
      if (su !== !!g.userData.super) {
        g.userData.super = su;
        g.userData.hp = su ? 10 : 1;
      }
      g.scale.setScalar(su ? 5 : 1);
      if (e[5]) { g.rotation.x += 0.2; } else g.rotation.x = 0;
    }
    for (let i = gnomes.length - 1; i >= 0; i--) {
      const g = gnomes[i];
      if (!seenGn.has(g.userData.netId)) {
        scene.remove(g);
        gnomes.splice(i, 1);
      }
    }
    // recently cut blades from everyone else
    applyCutList(d.cut);
    if (d.won && !won) {
      won = true;
      restartT = RESTART_LEN;
      winTitle.textContent = d.wonTitle;
      winText.dataset.msg = d.wonText;
      winText.textContent = d.wonText;
      winEl.style.display = 'flex';
    }
  } else if (d.t === 'reset') {
    restartT = -1;
    resetGame();
  } else if (d.t === 'steal') {
    if (d.id === myPlayerId) {
      man.position.x += d.dx * 2.6;
      man.position.z += d.dz * 2.6;
      man.position.x = THREE.MathUtils.clamp(man.position.x, -HALF + 2, HALF - 2);
      man.position.z = THREE.MathUtils.clamp(man.position.z, -HALF + 2, HALF - 2);
      manDropChicken();
    }
  }
}

function applyCutList(list) {
  if (!list || !list.length) return;
  let changed = false;
  for (const idx of list) {
    if (heights[idx] > 0.12) { heights[idx] = 0.08; changed = true; }
  }
  if (changed) heightAttr.needsUpdate = true;
}

// host side ----------------------------------------------------------------
function hostOnData(d) {
  if (d.t === 'p') {
    if (d.id === myPlayerId) return;
    const { _conn, ...s } = d;   // strip the connection object before caching â€” it can't be serialized
    const tw = twinFor(s.id);
    tw.s = s;
    tw.conn = _conn;
  } else if (d.t === 'c') {
    for (const idx of d.d) {
      if (heights[idx] > 0.1) { heights[idx] = 0.08; heightAttr.needsUpdate = true; cutCount++; pendingNetCut.push(idx); }
    }
  } else if (d.t === 'sw') {
    batHit({ x: d.x, z: d.z }, d.h);
    playBuf('hit', .6);
  } else if (d.t === 'grab') {
    const c = chickens.find(k => k.userData.netId === d.c && !k.userData.by);
    const gd = remotePlayers.get(d.id);
    const s = gd && gd.s;
    if (c && s && s.m === 'walk' && Math.hypot(c.position.x - s.mx, c.position.z - s.mz) < 2.6) {
      c.userData.by = d.id;
      sfxCluck();
    }
  }
}

setInterval(() => {
  if (!ready) return;
  sendAll(playerNetState());
  if (isGuest && netCutIdx.length) { sendAll({ t: 'c', d: netCutIdx }); netCutIdx = []; }
  if (isHost && conns.size) {
    const pl = [playerNetState()];
    for (const tw of remotePlayers.values()) if (tw.s) pl.push(tw.s);
    const ch = chickens.map(c => {
      c.getWorldPosition(tmpVec);
      return [c.userData.netId, tmpVec.x, tmpVec.z, c.userData.by || '', c.userData.carried ? 1 : 0, c.rotation.y];
    });
    const gn = gnomes.map(g => [g.userData.netId, g.position.x, g.position.z, g.position.y, g.rotation.y, g.userData.flying || g.userData.stun > 0 ? 1 : 0, g.userData.super ? 1 : 0, g.userData.hp]);
    const msg = { t: 's', e: elapsed, cc: cutCount, pl, ch, gn, cut: pendingNetCut, thm: currentTheme };
    pendingNetCut = [];
    if (superToastPending) { msg.sgToast = 1; superToastPending = false; }
    if (restartT > 0) msg.restartIn = Math.ceil(restartT);
    const m = Math.floor(elapsed / 60), s = Math.floor(elapsed % 60);
    if (won) {
      msg.won = true;
      msg.wonTitle = winTitle.textContent;
      msg.wonText = winText.textContent;
    }
    for (const c of conns) if (c.open) c.send(msg);
  }
}, 100);

// remote player twins ------------------------------------------------------
const remoteTints = [0x8a2bd9, 0xd98c2b, 0x2bd9c7, 0xd92b8a];
function twinFor(id) {
  let tw = remotePlayers.get(id);
  if (tw) { tw.seen = 0; return tw; }
  const tint = new THREE.Color(remoteTints[remotePlayers.size % remoteTints.length]);
  const rm = mower.clone(true), rn = man.clone(true);
  rm.traverse(o => {
    if (o.isMesh && o.name === 'mowerbody') { o.material = o.material.clone(); o.material.color = tint; }
  });
  rn.traverse(o => {
    if (o.isMesh && o.material === shirt) { o.material = o.material.clone(); o.material.color = tint; }
  });
  scene.add(rm, rn);
  tw = { rm, rn, wheels: [], sh: rn.getObjectByName('shoulder'), wheelPhase: 0, s: null, seen: 0, gn: null, tint: tint.getHex() };
  rm.traverse(o => { if (o.name === 'wheel') tw.wheels.push(o); });
  remotePlayers.set(id, tw);
  return tw;
}

function updateTwins(dt, t) {
  for (const tw of remotePlayers.values()) {
    const p = tw.s;
    if (!p) continue;
    const glide = (obj, x, z) => {
      obj.position.x += (x - obj.position.x) * Math.min(1, dt * 9);
      obj.position.z += (z - obj.position.z) * Math.min(1, dt * 9);
    };
    if (p.m === 'mow') {
      glide(tw.rm, p.x, p.z);
      tw.rm.rotation.y = p.h;
      tw.rn.position.set(p.x - Math.sin(p.h) * 2.3, 0, p.z - Math.cos(p.h) * 2.3);
      tw.rn.rotation.y = p.h + Math.PI;
    } else {
      glide(tw.rn, p.mx, p.mz);
      tw.rn.rotation.y = p.mh + Math.PI;
      glide(tw.rm, p.x, p.z);
      tw.rm.rotation.y = p.h;
    }
    const amp = Math.min(1, p.sp);
    const w = t * Math.abs(p.sp) * 2.2;
    let li = 0;
    tw.rn.traverse(o => { if (o.name === 'legpivot') o.rotation.x = (li++ % 2 ? -1 : 1) * Math.sin(w) * 0.6 * amp; });
    tw.wheelPhase -= p.sp * dt / 0.32;
    for (const wl of tw.wheels) wl.rotation.x = tw.wheelPhase;
  }
}

// guest: glide network entities toward snapshot targets every frame
function updateNetEnts(dt) {
  if (!isGuest) return;
  const f = Math.min(1, dt * 8);
  for (const c of chickens) {
    if (c.userData.tx === undefined) continue;
    if (!c.visible) continue;
    if (c.userData.by === myPlayerId) {
      // your rescued chicken rides on the man's back
      c.position.set(man.position.x, 1.0, man.position.z);
      c.rotation.y = man.rotation.y;
      continue;
    }
    c.position.x += (c.userData.tx - c.position.x) * f;
    c.position.z += (c.userData.tz - c.position.z) * f;
  }
  for (const g of gnomes) {
    if (g.userData.tx === undefined) continue;
    g.position.x += (g.userData.tx - g.position.x) * f;
    g.position.z += (g.userData.tz - g.position.z) * f;
    g.position.y = g.userData.ty;
  }
}

// man chicken-carrying state (mow co-op)
let mowCarryId = null;
function mowCarryChicken() {
  return chickens.find(c => c.userData.netId === mowCarryId) || null;
}
function manDropChicken() {
  const c = mowCarryChicken();
  if (c) {
    c.userData.by = '';
    c.userData.panic = 2;
    c.position.set(man.position.x + (Math.random() - 0.5) * 2, 0, man.position.z + (Math.random() - 0.5) * 2);
  }
  sfxHit();
  mowCarryId = null;
}
function gnomeTakeChicken(g, c) {
  c.userData.by = '';
  c.userData.carried = true;
  g.userData.carrying = c;
  g.add(c);
  c.position.set(0, 1.05, -0.1);
  c.rotation.set(0, 0, 0);
  c.rotation.z = 0.6;
  c.scale.setScalar(0.75);
  sfxCluck();
}

const clock = new THREE.Clock();
const camPos = new THREE.Vector3(0, 6, 45);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  grassMat.uniforms.uTime.value = t;

  if (!ready) { renderer.render(scene, camera); return; }

  // mower engine drone
  if (audioCtx && soundsReady && !engineNodes) startEngine();
  if (engineNodes) {
    engineNodes.gain.gain.setTargetAtTime(mode === 'mow' ? 0.55 : 0, audioCtx.currentTime, 0.08);
    engineNodes.src.playbackRate.setTargetAtTime(0.85 + Math.abs(mowCtl.speed) * 0.025, audioCtx.currentTime, 0.06);
  }

  if (!won) {
    if (forceStart) started = true;
    if (!started && (keys.KeyW || keys.ArrowUp || keys.KeyS || keys.ArrowDown || joy.id !== null || mode === 'mow' || touchGrip)) started = true;
    if (started) elapsed += dt;

    // grab / release logic
    const hx = mower.position.x - Math.sin(mowCtl.heading) * 1.5;
    const hz = mower.position.z - Math.cos(mowCtl.heading) * 1.5;
    const nearHandle = Math.hypot(man.position.x - hx, man.position.z - hz) < 2.4;
    if ((mouseDown || touchGrip) && nearHandle) mode = 'mow';
    else if (!mouseDown && !touchGrip && mode === 'mow') { mode = 'walk'; mowCtl.speed = 0; }
    if (isTouch) {
      if (mode === 'mow') { actLabel.textContent = 'LET GO'; actBtn.classList.add('on'); }
      else { actBtn.classList.remove('on'); actLabel.textContent = nearHandle ? 'GRAB MOWER' : 'SWING BAT'; }
    }
    helpEl.textContent = isTouch
      ? (mode === 'mow' ? 'GRIPPING HANDLE â€” STICK drive/steer | PUSH FAR for boost'
          : 'Walk to the mower handle and tap GRAB | STICK drive | PUSH FAR for run')
      : (mode === 'mow'
          ? 'GRIPPING HANDLE â€” W/S drive | A/D steer | Shift boost | RELEASE MOUSE to let go'
          : 'Hold LEFT MOUSE on the mower handle to grab it | W/A/S/D walk | Shift run');

    const me = mode === 'mow' ? mower : man;
    const ctl = mode === 'mow' ? mowCtl : walkCtl;

    // drive active character (keyboard / on-screen touch joystick)
    const jActive = joy.id !== null;
    const boost = keys.ShiftLeft || keys.ShiftRight || (jActive && joy.mag > 0.92);
    const accel = mode === 'mow' ? (boost ? 22 : 12) : (boost ? 18 : 10);
    const maxSpeed = mode === 'mow' ? (boost ? 16 : 9) : (boost ? 10 : 5);
    const fwdIn = keys.KeyW || keys.ArrowUp || (jActive && -joy.y > 0.3);
    const backIn = keys.KeyS || keys.ArrowDown || (jActive && joy.y > 0.3);
    const leftIn = keys.KeyA || keys.ArrowLeft || (jActive && joy.x < -0.3);
    const rightIn = keys.KeyD || keys.ArrowRight || (jActive && joy.x > 0.3);
    if (fwdIn) ctl.speed += accel * dt;
    else if (backIn) ctl.speed -= accel * 0.7 * dt;
    else ctl.speed *= Math.pow(0.02, dt); // friction
    ctl.speed = THREE.MathUtils.clamp(ctl.speed, -maxSpeed * 0.5, maxSpeed);
    const turnRate = mode === 'mow' ? 2.2 : 3.0;
    if (leftIn) ctl.heading += dt * turnRate * Math.min(1, Math.abs(ctl.speed) / 2) * Math.sign(ctl.speed || 1);
    if (rightIn) ctl.heading -= dt * turnRate * Math.min(1, Math.abs(ctl.speed) / 2) * Math.sign(ctl.speed || 1);

    me.rotation.y = ctl.heading + (mode === 'walk' ? Math.PI : 0); // the man's model faces -z
    me.position.x += Math.sin(ctl.heading) * ctl.speed * dt;
    me.position.z += Math.cos(ctl.heading) * ctl.speed * dt;

    // bounds
    const lim = HALF - 2;
    me.position.x = THREE.MathUtils.clamp(me.position.x, -lim, lim);
    me.position.z = THREE.MathUtils.clamp(me.position.z, -lim, lim);

    // tree collision
    for (const tr of trees) {
      const dx = me.position.x - tr.x, dz = me.position.z - tr.z;
      const d = Math.hypot(dx, dz), min = tr.r + (mode === 'mow' ? 0.9 : 0.5);
      if (d < min && d > 0.001) {
        me.position.x = tr.x + dx / d * min;
        me.position.z = tr.z + dz / d * min;
        ctl.speed *= 0.4;
      }
    }

    if (mode === 'mow') {
      // wheels + body bob
      const wSpin = mowCtl.speed * dt / 0.32;
      for (const w of wheels) w.rotation.x -= wSpin;
      mower.rotation.z = Math.sin(t * 20) * 0.008 * Math.min(1, Math.abs(mowCtl.speed) / 3);

      // man is attached behind the mower
      man.position.set(
        mower.position.x - Math.sin(mowCtl.heading) * 2.3,
        man.position.y,
        mower.position.z - Math.cos(mowCtl.heading) * 2.3
      );
      man.rotation.y = mowCtl.heading + Math.PI;
    }

    // walking animation
    const walk = t * Math.abs(ctl.speed) * (mode === 'mow' ? 1.6 : 2.2);
    const amp = Math.min(1, Math.abs(ctl.speed));
    legPivots[0].rotation.x = Math.sin(walk) * 0.6 * amp;
    legPivots[1].rotation.x = -Math.sin(walk) * 0.6 * amp;
    man.position.y = Math.abs(Math.sin(walk)) * 0.06 * amp;

    // footsteps when moving
    stepAcc += Math.abs(ctl.speed) * dt;
    if (stepAcc > 1.1) { stepAcc = 0; sfxStep(); }

    // debug: ?mowdemo=1 teleports the man through chicken pickup, then to a gnome's face
    if (new URLSearchParams(location.search).has('mowdemo')) {
      if (mowCarryId === null) {
        let bc = null, bd = Infinity;
        for (const c of chickens) { if (!c.userData.by && !c.userData.carried) { const d2 = c.position.distanceToSquared(man.position); if (d2 < bd) { bd = d2; bc = c; } } }
        if (bc) man.position.set(bc.position.x + 0.2, 0, bc.position.z);
      } else if (gnomes.length) {
        man.position.set(gnomes[0].position.x + 0.6, 0, gnomes[0].position.z);
      }
    }
    // the man can scoop up a free chicken while walking â€” gnomes will come for him
    if (mode === 'walk' && mowCarryId === null) {
      for (const c of chickens) {
        if (c.userData.by || c.userData.carried) continue;
        if (c.position.distanceTo(man.position) < 1.0) {
          if (!isGuest) {
            c.userData.by = myPlayerId;
            mowCarryId = c.userData.netId;
            sfxCluck();
            man._grabSent = null;
            break;
          } else if (man._grabSent !== c.userData.netId) {
            man._grabSent = c.userData.netId;
            sendAll({ t: 'grab', c: c.userData.netId, id: myPlayerId });
            break;
          }
        }
      }
    }
    const mcr = mowCarryChicken();
    if (mcr) {
      mcr.position.set(man.position.x, 1.0, man.position.z);
      mcr.rotation.y = man.rotation.y;
    }

    if (mode === 'mow') cutGrass();

    // gnomes + bat swing animation
    if (!isGuest) updateGnomes(dt, t);
    bat.visible = mode === 'walk';
    if (swingT > 0) swingT -= dt;
    // swing sweeps horizontally (yaw) across the body for wide hits
    shoulder.rotation.x = -0.62;
    shoulder.rotation.y = swingT > 0
      ? Math.sin((1 - Math.max(swingT, 0) / 0.4) * Math.PI) * 2.4 - 1.2
      : 0;

    // HUD
    const progress = cutCount / total;
    fill.style.width = (progress * 100).toFixed(1) + '%';
    pct.textContent = 'Lawn cut: ' + (progress * 100).toFixed(1) + '%  |  Chickens alive: ' + chickens.length;
    const shownElapsed = isGuest ? netElapsed : elapsed;
    const m = Math.floor(shownElapsed / 60), s = Math.floor(shownElapsed % 60);
    timeEl.textContent = m + ':' + String(s).padStart(2, '0');

    if (!isGuest && chickens.length === 0) {
      won = true;
      restartT = RESTART_LEN;
      winTitle.textContent = 'ALL YOUR CHICKENS ARE GONE!';
      winText.dataset.msg = winText.textContent = 'The lawn gnomes got your whole flock...';
      winEl.style.display = 'flex';
    } else if (!isGuest && progress >= 0.95) {
      // 95% of the lawn is enough â€” the last few blades aren't the win condition
      won = true;
      restartT = RESTART_LEN;
      winTitle.textContent = 'LAWN MOWED!';
      winText.dataset.msg = winText.textContent = 'You finished in ' + timeEl.textContent + ' with ' + chickens.length + ' chickens alive';
      winEl.style.display = 'flex';
    }
  }

  if (won && restartT > 0) {
    restartT -= dt;
    const rt = Math.max(1, Math.ceil(restartT));
    const base = winText.dataset.msg || winText.textContent;
    winText.dataset.msg = base;
    winText.textContent = base + ' â€” new round starting in ' + rt + 's';
    if (!isGuest && restartT <= 0) {
      sendAll({ t: 'reset' });
      resetGame();
    }
  }

  // chickens (always alive, even after winning) â€” host/solo simulate; guests render synced state
  if (!isGuest) updateChickens(dt, t);
  updateTwins(dt, t);
  updateNetEnts(dt);

  // clipping particles
  for (const p of parts) {
    if (p.life > 0) {
      p.life -= dt;
      p.vy -= 12 * dt;
      p.m.position.x += p.vx * dt;
      p.m.position.y += p.vy * dt;
      p.m.position.z += p.vz * dt;
      p.m.rotation.x += dt * 10;
      if (p.m.position.y < 0.05 || p.life <= 0) { p.life = 0; p.m.visible = false; }
    }
  }

  // camera follows the active character
  const ah = mode === 'mow' ? mowCtl.heading : walkCtl.heading;
  const follow = mode === 'mow' ? mower : man;
  const fx = Math.sin(ah), fz = Math.cos(ah);
  const target = new THREE.Vector3(
    follow.position.x - fx * 9,
    5.5,
    follow.position.z - fz * 9
  );
  camPos.lerp(target, 1 - Math.pow(0.001, dt));
  camera.position.copy(camPos);
  camera.lookAt(follow.position.x + fx * 3, 1.2, follow.position.z + fz * 3);

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
